# Four origins, one blueprint.
#
# Connect the repository in the Render dashboard and point it at this file, or `render blueprint
# launch`. Four services come up on four `*.onrender.com` hostnames, which are four genuinely
# distinct origins on HTTPS, which is what WebMCP requires and what this entry is about.
#
# **The one thing to get right.** Every service is built with the origin URLs it needs in its
# environment, because `import.meta.env` is read when the bundle is built. Render translates a
# service's environment variables into Docker build arguments, which is why everything the build
# needs — `APP` included — is listed under `envVars` and not anywhere else. If a hostname changes,
# rebuild; a deployment whose origins are stale fails as a silent discovery timeout rather than as an
# error anybody can read. `/verify.html` on the hub says which origins it actually reached, so the
# check takes ten seconds.
#
# Service names decide hostnames, so changing a name here means changing every URL below it.

services:
  - type: web
    name: threshold-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /verify.html
    envVars:
      # Which app in the workspace this image serves. Read at build time and at run time.
      - key: APP
        value: hub
      # The hub's own origin, and the three organisations it brokers across. The hub's CSP needs the
      # same origins the bundle was built against, so these are read in both stages of the build.
      - key: VITE_HUB_ORIGIN
        value: https://threshold-hub.onrender.com
      - key: VITE_ORIGIN_RESPITE
        value: https://threshold-respite.onrender.com
      - key: VITE_ORIGIN_HOMECARE
        value: https://threshold-homecare.onrender.com
      - key: VITE_ORIGIN_TRANSPORT
        value: https://threshold-transport.onrender.com

  - type: web
    name: threshold-respite
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /api/units
    envVars:
      - key: APP
        value: provider-respite
      # The one origin allowed to frame this organisation's page. The other half of the same gate is
      # `exposedTo` on the tools themselves.
      - key: VITE_HUB_ORIGIN
        value: https://threshold-hub.onrender.com
      # The demo reset token. Deliberately a fixed, published value rather than a generated one:
      # the provider's own page has to send it, the page is built ahead of time, and a token the
      # page cannot know is a reset button that never works. It is a speed bump so the route is not
      # something a crawler trips over, which is all §29 asks of it. Without any token the route
      # refuses outright.
      - key: VITE_RESET_TOKEN
        value: demo-reset
      - key: THRESHOLD_RESET_TOKEN
        value: demo-reset

  - type: web
    name: threshold-homecare
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /api/units
    envVars:
      - key: APP
        value: provider-homecare
      - key: VITE_HUB_ORIGIN
        value: https://threshold-hub.onrender.com
      - key: VITE_RESET_TOKEN
        value: demo-reset
      - key: THRESHOLD_RESET_TOKEN
        value: demo-reset

  - type: web
    name: threshold-transport
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    healthCheckPath: /api/units
    envVars:
      - key: APP
        value: provider-transport
      - key: VITE_HUB_ORIGIN
        value: https://threshold-hub.onrender.com
      - key: VITE_RESET_TOKEN
        value: demo-reset
      - key: THRESHOLD_RESET_TOKEN
        value: demo-reset
